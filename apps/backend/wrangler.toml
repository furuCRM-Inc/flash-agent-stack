name = "flash-agent-stack"
main = "src/cf-worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Workers AI binding (free tier: 10,000 neurons/day)
[ai]
binding = "AI"

[vars]
# Optional: add an API key here if you want to restrict access
# FLASH_AGENT_SECRET = "your-secret-key"

# Routes (update after deployment)
# [[routes]]
# pattern = "flash-agent.your-domain.com/*"
# zone_name = "your-domain.com"

# wrangler compiles TypeScript natively — no separate build step needed
